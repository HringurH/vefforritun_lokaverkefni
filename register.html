<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/login-register.css">
    <script src="js/auth.js" defer></script>
    <title>Feline Good | Register</title>
</head>
<body>
    <div class="main-container">
        <header>
            <a href="index.html" id="title-link"><h1>Feline Good</h1></a>
        </header>
        <main>
            <div class="banner banner-left">
                <img src="media/cat-right.png" alt="An image of a cat looking to the right with a wide open mouth.">
            </div>
            <div id="main-content">
                <h2>Register</h2>
                <p id="message"></p>
                <form id="register-form">
                    <label for="register-username">Username:</label>
                    <input type="text" id="register-username" name="username" required>
                    
                    <label for="register-password">Password:</label>
                    <input type="password" id="register-password" name="password" required>
                    
                    <button type="submit">Confirm</button>
                </form>
                <p>Already have an account? <a href="login.html">Login here</a>.</p>
            </div>
            <div class="banner banner-right">
                <img src="media/cat-left.png" alt="An image of a cat looking to the left with a wide open mouth.">
            </div>
        </main>
    </div>
</body>
</html>
